<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive viewport check</title><style>body{font:16px system-ui;background:#ddd;color:#111}iframe{display:block;border:2px solid #333;height:900px;margin-top:14px;background:white}select,button{font:inherit;padding:10px}label{display:inline-block;margin:8px}</style></head><body><h1>Responsive viewport check</h1><p>Chromium iframe viewport checks. This does not emulate mobile hardware, touch or Safari.</p><label>Viewport width<select id="width"><option>320</option><option selected>390</option><option>768</option><option>1280</option></select></label><label>Page<select id="page"><option value="hops.html#improvement-loop">HOPS improvement loop</option><option value="rr01-pilot.html">RR-01 pilot capture</option><option value="project-status.html">Project status</option></select></label><button id="apply">Apply viewport</button><iframe title="Responsive page" width="390" src="../hops.html#improvement-loop"></iframe><script>document.querySelector('#apply').onclick=()=>{const f=document.querySelector('iframe');f.width=document.querySelector('#width').value;f.src='../'+document.querySelector('#page').value;};</script></body></html>
